<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#8A7BFF"/>
      <stop offset="0.48" stop-color="#5B3FE4"/>
      <stop offset="1" stop-color="#281773"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.32" cy="0.14" r="0.78">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.26"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="shade" x1="0" y1="0.45" x2="0" y2="1">
      <stop offset="0" stop-color="#180A4A" stop-opacity="0"/>
      <stop offset="1" stop-color="#180A4A" stop-opacity="0.32"/>
    </linearGradient>

    <linearGradient id="arc" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8E4FF"/>
    </linearGradient>

    <clipPath id="shape">
      <rect x="96" y="96" width="832" height="832" rx="190"/>
    </clipPath>
  </defs>

  <!-- 底板：macOS squircle -->
  <rect x="96" y="96" width="832" height="832" rx="190" fill="url(#bg)"/>

  <!-- 柔和光影，裁进圆角 -->
  <g clip-path="url(#shape)">
    <rect x="96" y="96" width="832" height="832" fill="url(#sheen)"/>
    <rect x="96" y="96" width="832" height="832" fill="url(#shade)"/>
  </g>

  <!-- 计时环轨道 -->
  <circle cx="512" cy="512" r="248" fill="none" stroke="#FFFFFF" stroke-opacity="0.20" stroke-width="66"/>
  <!-- 已走过的时间 -->
  <path d="M 512 264 A 248 248 0 1 1 278.9 596.8"
        fill="none" stroke="url(#arc)" stroke-width="66" stroke-linecap="round"/>
  <!-- 进度头 -->
  <circle cx="278.9" cy="596.8" r="33" fill="#5BE3B4"/>

  <!-- 暂停符 -->
  <rect x="438" y="428" width="52" height="168" rx="26" fill="#FFFFFF"/>
  <rect x="534" y="428" width="52" height="168" rx="26" fill="#FFFFFF"/>
</svg>
